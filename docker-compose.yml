services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hardstoun
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/hearthstone_full.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardstoun"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # в контейнере приложение читает server.json — подсовываем ему докер-версию
      - ./server.docker.json:/app/server.json:ro

volumes:
  pgdata:
